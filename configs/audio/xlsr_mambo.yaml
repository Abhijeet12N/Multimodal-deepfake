# XLSR-MamBo Audio Anti-Spoofing Detector Configuration (Optional Challenger)
model:
  model_id: "xlsr_mambo"
  model_class: "XLSRMamBoDetector"
  frontend: "wav2vec2_xlsr"
  backend: "mambo_ssm"
  upstream_repo: "https://github.com/saki-ciallo/XLSR-MamBo"
  license: "Apache-2.0"
  status: "optional_challenger"
  hardware_requirements:
    cuda_version: ">=12.8"
    python_version: ">=3.12"
    dependencies:
      - "torch>=2.4.0"
      - "mamba_ssm"
      - "flash_attn"
      - "hydra-core"

preprocessing:
  sample_rate: 16000
  channels: 1

windowing:
  window_seconds: 4.0
  window_samples: 64000
  hop_seconds: 2.0
  hop_samples: 32000
  padding_mode: "repeat"
  min_rms_vad: 0.015

score_semantics:
  raw_score_semantics: "two_class_logits"
  score_orientation: "higher_is_bonafide"
  class_index_mapping:
    0: "spoof"
    1: "bonafide"
  target_score_index: 1
  calibrated_threshold: 0.0

aggregation:
  strategy: "mean"
  top_k: 3
  vad_enabled: true
