# SSL-AASIST Audio Anti-Spoofing Detector Configuration
model:
  model_id: "ssl_aasist"
  model_class: "SSLAASISTDetector"
  frontend: "wav2vec2_xlsr"
  backend: "aasist"
  upstream_repo: "https://github.com/TakHemlata/SSL_Anti-spoofing"
  license: "MIT"
  target_training_runtime: "Google Colab (CUDA GPU)"

preprocessing:
  sample_rate: 16000
  channels: 1

windowing:
  window_seconds: 4.0375
  window_samples: 64600
  hop_seconds: 2.0
  hop_samples: 32000
  padding_mode: "repeat"
  min_rms_vad: 0.015

score_semantics:
  raw_score_semantics: "two_class_logits"
  score_orientation: "higher_is_bonafide"
  class_index_mapping:
    0: "spoof"
    1: "bonafide"
  target_score_index: 1

aggregation:
  strategy: "mean"
  top_k: 3
  vad_enabled: true
